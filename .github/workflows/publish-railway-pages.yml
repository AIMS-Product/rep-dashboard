name: Publish Railway Dashboard to Pages

on:
  push:
    branches: [main]
    paths: ['shared/current.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage published dashboard files
        run: |
          mkdir -p "${RUNNER_TEMP}/dashboard-pages"
          git archive HEAD -- index.html archive.html archives daily-preview.html data.json shared | tar -x -C "${RUNNER_TEMP}/dashboard-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/dashboard-pages
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
