name: Update Sales Dashboard

on:
  workflow_dispatch:  # Triggered by cron-job.org every 15 minutes

permissions:
  contents: write

# A refresh can take longer than the 15-minute dispatch interval.
concurrency:
  group: rep-dashboard-publication
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh and publish dashboard data
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
        run: bash scripts/refresh_and_publish.sh
