<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --white: #ffffff;
    --text: #1a1d23;
    --text-secondary: #5f6b7a;
    --text-muted: #8c95a4;
    --text-faint: #b0b8c6;
    --border: #e5e7ec;
    --border-light: #eef0f3;
    --row-hover: #f8f9fb;
    --th-bg: #fafbfc;
    --green: #10b981;
    --green-bg: #ecfdf5;
    --teal: #0d9488;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --amber-bg: #fffbeb;
    --red: #ef4444;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1520px;
    margin: 0 auto;
    padding: 28px 28px 48px;
  }

  /* ─── Top Bar (info table | month title | KPI cards) ─── */
  .top-bar {
    display: flex;
    align-items: stretch;
    gap: 16px;
    margin-bottom: 16px;
  }

  /* Info table (left) */
  .info-table {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .info-table table { border-collapse: collapse; }
  .info-table td {
    padding: 9px 16px;
    font-size: 12px;
    border-bottom: 1px solid var(--border-light);
  }
  .info-table tr:last-child td { border-bottom: none; }
  .info-table td:first-child {
    color: var(--text-muted);
    font-weight: 600;
    border-right: 1px solid var(--border-light);
    white-space: nowrap;
  }
  .info-table td:last-child {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
    text-align: right;
  }

  /* Month title (center) */
  .month-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .month-center h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .month-center .meta {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* KPI cards (right) */
  .kpi-cards {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }
  .kpi {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 22px;
    min-width: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kpi-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .kpi-val {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
    line-height: 1.1;
  }
  .kpi-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .kpi-closers {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 200px;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kpi-closers .kpi-label { margin-bottom: 8px; }
  .closers-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
    font-size: 12px;
    line-height: 1.6;
  }
  .closer-name { font-weight: 600; color: var(--text); white-space: nowrap; }
  .closer-val { font-weight: 700; color: var(--green); text-align: right; white-space: nowrap; }
  .closer-count { font-weight: 400; color: var(--text-muted); font-size: 10px; }

  /* ─── Quota Strip ─── */
  .quota-strip {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .qs-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .qs-track {
    flex: 1;
    height: 8px;
    background: var(--border-light);
    border-radius: 4px;
    overflow: hidden;
  }
  .qs-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--green), var(--teal));
    transition: width 0.6s ease;
  }
  .qs-pct {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--teal);
    white-space: nowrap;
  }
  .qs-detail {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ─── Three Board Grid ─── */
  .boards {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }
  .board {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .board-head {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
  }
  .board-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 1px;
  }
  .board-sub {
    font-size: 10px;
    color: var(--text-muted);
  }

  .board table { width: 100%; border-collapse: collapse; }
  .board thead th {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--text-muted);
    text-align: right;
    padding: 9px 14px;
    background: var(--th-bg);
    border-bottom: 1px solid var(--border);
  }
  .board thead th:first-child { text-align: left; padding-left: 18px; }
  .board thead th:last-child { padding-right: 18px; }

  .board tbody td {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    text-align: right;
    border-bottom: 1px solid var(--border-light);
  }
  .board tbody td:first-child { text-align: left; padding-left: 18px; white-space: nowrap; }
  .board tbody td:last-child { padding-right: 18px; }
  .board tbody tr:hover { background: var(--row-hover); }
  .board tbody tr:last-child td { border-bottom: none; }

  .board tfoot td {
    padding: 11px 14px;
    font-size: 12px;
    font-weight: 700;
    border-top: 2px solid var(--border);
    background: var(--th-bg);
    text-align: right;
    color: var(--text);
  }
  .board tfoot td:first-child {
    text-align: left; padding-left: 18px;
    color: var(--text-secondary);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.5px;
  }
  .board tfoot td:last-child { padding-right: 18px; }

  /* Rank numbers */
  .rk {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 19px; height: 19px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 800;
    margin-right: 7px;
    font-family: var(--mono);
    background: var(--border-light);
    color: var(--text-muted);
    vertical-align: middle;
  }
  .rk-1 { background: #dbeafe; color: var(--blue); }
  .rk-2, .rk-3 { background: var(--green-bg); color: var(--green); }

  .rep-name { font-weight: 600; vertical-align: middle; }
  .mgr-tag { font-size: 9px; font-weight: 600; color: var(--text-muted); margin-left: 4px; vertical-align: middle; }

  /* Goal badge */
  .goal-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--green-bg);
    color: var(--green);
    margin-left: 6px;
    vertical-align: middle;
  }
  .goal-badge::before { content: '✓'; font-size: 8px; }

  /* Quota mini bar in revenue board */
  .q-cell {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .q-bar {
    width: 56px; height: 5px;
    background: var(--border-light);
    border-radius: 3px;
    overflow: hidden;
  }
  .q-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .bg-green { background: var(--green); }
  .bg-teal { background: var(--teal); }
  .bg-amber { background: var(--amber); }
  .bg-red { background: var(--red); }

  .pv {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    min-width: 40px;
    text-align: right;
  }
  .t-green { color: var(--green); }
  .t-teal { color: var(--teal); }
  .t-amber { color: var(--amber); }
  .t-red { color: var(--red); }

  /* Rate values */
  .rv { font-weight: 600; }
  .rv-g { color: var(--green); }
  .rv-a { color: var(--amber); }
  .rv-r { color: var(--red); }

  /* ─── Process Adherence ─── */
  .adherence-board { grid-column: 1 / -1; }
  .adherence-board .board-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .preview-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border: 1px solid #bfdbfe;
    border-radius: 999px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .6px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .preview-pill::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3b82f6;
  }
  .adherence-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-width: 62px;
    padding: 5px 7px;
    border: 1px solid var(--border-light);
    border-radius: 7px;
    background: var(--white);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .adherence-btn::after { content: '›'; font-family: var(--font); font-size: 16px; line-height: 1; }
  .adherence-btn:hover { background: var(--row-hover); border-color: var(--border); transform: translateY(-1px); }
  .adherence-btn:focus-visible,
  .drawer-close:focus-visible {
    outline: 3px solid rgba(59, 130, 246, .35);
    outline-offset: 2px;
  }
  .adherence-btn[disabled] {
    color: var(--text-faint);
    cursor: default;
  }
  .adherence-btn[disabled]::after { content: ''; }
  .adherence-btn[disabled]:hover { background: var(--white); border-color: var(--border-light); transform: none; }
  .adherence-table-wrap { overflow-x: auto; }
  .adherence-board table { min-width: 1040px; table-layout: fixed; }
  .adherence-board thead .adherence-group-row th {
    padding-top: 10px;
    padding-bottom: 8px;
    color: var(--text-secondary);
    font-size: 10px;
    text-align: center;
  }
  .adherence-board thead .adherence-group-row .adherence-rep-head {
    padding-left: 18px;
    text-align: left;
    vertical-align: middle;
  }
  .adherence-board thead .adherence-column-row th {
    padding: 7px 10px 9px;
    color: var(--text-muted);
    font-size: 8px;
    line-height: 1.25;
    text-align: center;
    white-space: normal;
  }
  .adherence-board .adherence-post-group,
  .adherence-board .adherence-post-start {
    border-left: 2px solid var(--border);
  }
  .adherence-board tbody td {
    padding: 9px 10px;
    text-align: center;
  }
  .adherence-board tbody td:first-child { padding-left: 18px; text-align: left; }
  .adherence-average-cell { background: #fbfcfe; }
  .adherence-step-value {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 800;
  }
  .score-high { color: var(--green); }
  .score-mid { color: var(--teal); }
  .score-watch { color: var(--amber); }
  .score-low { color: var(--red); }

  .drawer-shell {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    justify-content: flex-end;
    background: rgba(15, 23, 42, 0);
    transition: background .2s ease;
  }
  .drawer-shell[hidden] { display: none; }
  .drawer-shell.is-open { background: rgba(15, 23, 42, .32); }
  .drawer-panel {
    width: min(480px, 94vw);
    height: 100%;
    overflow-y: auto;
    background: var(--white);
    border-left: 1px solid var(--border);
    box-shadow: -20px 0 60px rgba(15, 23, 42, .12);
    transform: translateX(100%);
    transition: transform .24s cubic-bezier(.22, 1, .36, 1);
  }
  .drawer-shell.is-open .drawer-panel { transform: translateX(0); }
  .drawer-head {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: 24px 24px 18px;
    background: rgba(255,255,255,.96);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }
  .drawer-eyebrow {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .8px;
    text-transform: uppercase;
  }
  .drawer-title { margin-top: 4px; font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
  .drawer-close {
    display: inline-grid;
    place-items: center;
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--white);
    color: var(--text-secondary);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  .drawer-close:hover { background: var(--row-hover); color: var(--text); }
  .drawer-body { padding: 24px; }
  .drawer-score {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 18px;
    padding: 18px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--th-bg);
  }
  .drawer-score-value { font-family: var(--mono); font-size: 36px; font-weight: 800; letter-spacing: -1.5px; }
  .drawer-score-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
  .drawer-score-note { margin-top: 3px; color: var(--text-muted); font-size: 10px; line-height: 1.45; }
  .step-list { display: grid; gap: 12px; }
  .step-card { padding: 16px; border: 1px solid var(--border); border-radius: 10px; }
  .step-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .step-name { font-size: 13px; font-weight: 750; }
  .step-pct { font-family: var(--mono); font-size: 18px; font-weight: 800; }
  .step-track { height: 6px; margin: 12px 0 9px; overflow: hidden; border-radius: 99px; background: var(--border-light); }
  .step-fill { height: 100%; border-radius: 99px; background: currentColor; }
  .step-meta { display: flex; justify-content: space-between; gap: 14px; color: var(--text-muted); font-size: 10px; }
  .step-count { color: var(--text-secondary); font-family: var(--mono); font-weight: 700; white-space: nowrap; }
  .drawer-rule-note {
    margin-top: 18px;
    padding: 12px 14px;
    border-left: 3px solid #93c5fd;
    background: #eff6ff;
    color: #475569;
    font-size: 10px;
    line-height: 1.55;
  }
  body.drawer-open { overflow: hidden; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ─── Footer ─── */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-faint);
  }
  .dl-btn {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
  }
  .dl-btn:hover { background: var(--bg); }

  /* ─── Loading ─── */
  .loading {
    text-align: center;
    padding: 100px 24px;
    color: var(--text-secondary);
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fade { opacity: 0; transform: translateY(6px); animation: up 0.35s ease forwards; }
  .d1 { animation-delay: 0.04s; }
  .d2 { animation-delay: 0.1s; }
  @keyframes up { to { opacity: 1; transform: none; } }

  /* ─── Responsive ─── */
  @media (max-width: 1200px) {
    .boards { grid-template-columns: 1fr; }
    .top-bar { flex-direction: column; align-items: stretch; }
    .kpi-cards { justify-content: center; }
    .month-center { padding: 12px 0; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 16px 10px 32px; }
    .kpi-cards { flex-direction: column; }
    .kpi { min-width: auto; }
    .month-center h1 { font-size: 22px; }
    .drawer-panel { width: 100%; }
    .drawer-head, .drawer-body { padding-left: 18px; padding-right: 18px; }
    .adherence-board .board-head { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div>Loading dashboard&hellip;</div>
</div>

<div class="drawer-shell" id="adherenceDrawer" hidden>
  <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-describedby="drawerDescription">
    <header class="drawer-head">
      <div>
        <div class="drawer-eyebrow" id="drawerEyebrow">Process adherence</div>
        <h2 class="drawer-title" id="drawerTitle">Details</h2>
      </div>
      <button class="drawer-close" id="drawerClose" type="button" aria-label="Close adherence details">&times;</button>
    </header>
    <div class="drawer-body" id="drawerContent"></div>
  </section>
</div>

<script>
(async function() {
  const app = document.getElementById('app');
  const query = new URLSearchParams(window.location.search);
  const previewMode = query.get('preview') === 'adherence';
  const dataFile = previewMode ? 'data.preview.json' : 'data.json';
  try {
    const r = await fetch(dataFile + '?' + Date.now());
    if (!r.ok) throw new Error(dataFile + ' not found');
    const D = await r.json();
    app.innerHTML = '';
    render(D);
  } catch (e) {
    app.innerHTML = `<div class="loading" style="color:var(--red)">Failed to load: ${e.message}</div>`;
  }

  function fmt$(n) {
    if (Math.abs(n) >= 1000) return '$' + (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
    return '$' + n.toLocaleString('en-US',{maximumFractionDigits:0});
  }
  function fmtBig$(n) {
    if (n >= 1000000) return '$' + (n/1e6).toFixed(2) + 'M';
    if (n >= 1000) return '$' + (n/1000).toFixed(1) + 'K';
    return '$' + n.toFixed(0);
  }

  function toPST(s) {
    const cleaned = s.replace(' PST','-08:00').replace(' PDT','-07:00').replace(' UTC','Z').replace(' ','T');
    const d = new Date(cleaned);
    if (isNaN(d)) return s;
    return d.toLocaleString('en-US', {
      timeZone:'America/Los_Angeles',
      weekday:'long', year:'numeric', month:'long', day:'numeric',
      hour:'numeric', minute:'2-digit', hour12:true,
      timeZoneName:'short'
    });
  }

  function qCol(p) {
    if (p >= 100) return ['bg-green','t-green'];
    if (p >= 70)  return ['bg-teal','t-teal'];
    if (p >= 40)  return ['bg-amber','t-amber'];
    return ['bg-red','t-red'];
  }
  function rc(v,g,o) {
    if (v >= g) return 'rv rv-g';
    if (v >= o) return 'rv rv-a';
    return 'rv rv-r';
  }
  function rkC(i) {
    if (i===0) return 'rk rk-1';
    if (i<3) return 'rk rk-'+( i+1);
    return 'rk';
  }
  function repLabel(r) {
    const tag = r.is_manager ? '<span class="mgr-tag">(mgr)</span>' : r.is_lead ? '<span class="mgr-tag">(lead)</span>' : '';
    return `<span class="rep-name">${r.name}</span>${tag}`;
  }
  function pctText(value) { return value == null ? '—' : value + '%'; }
  function scoreTone(value) {
    if (value == null) return '';
    if (value >= 90) return 'score-high';
    if (value >= 75) return 'score-mid';
    if (value >= 60) return 'score-watch';
    return 'score-low';
  }
  function adherenceButton(r, phase, repIndex) {
    const key = phase === 'pre_call' ? 'pre_call_pct' : 'post_call_pct';
    const label = phase === 'pre_call' ? 'pre-call' : 'post-call';
    const value = r.adherence && r.adherence[key];
    if (value == null) {
      return `<button class="adherence-btn" type="button" disabled aria-label="No ${label} adherence data for ${r.name}">—</button>`;
    }
    return `<button class="adherence-btn ${scoreTone(value)}" type="button" data-adherence-rep="${repIndex}" data-adherence-phase="${phase}" aria-label="Open ${label} adherence details for ${r.name}, ${value} percent">${value}%</button>`;
  }

  function adherenceStepValue(r, key) {
    const cell = r.adherence && r.adherence.steps && r.adherence.steps[key];
    const value = cell && cell.pct;
    const label = cell ? cell.label : key;
    return `<span class="adherence-step-value ${scoreTone(value)}" aria-label="${label}: ${value == null ? 'no data' : value + ' percent'}">${pctText(value)}</span>`;
  }

  function render(D) {
    window._dashData = D;
    const reps = D.reps || [];
    const remaining = Math.max(0, D.team_quota - D.total_revenue);
    const daysLeft = D.days_in_month - D.day_of_month;
    const qPct = Math.min(D.pct_team_quota, 100);

    // ── TOP BAR
    const topBar = `
      <div class="top-bar fade">
        <div class="info-table">
          <table>
            <tr><td>Day in the month</td><td>${D.day_of_month} / ${D.days_in_month}</td></tr>
            <tr><td>Working days</td><td>${D.working_days_elapsed} / ${D.working_days_total}</td></tr>
            <tr><td>% of month passed</td><td>${D.pct_month_passed}%</td></tr>
          </table>
        </div>
        <div class="month-center">
          <h1>${D.month_label}</h1>
          <div class="meta">${toPST(D.updated_at)}</div>
        </div>
        <div class="kpi-cards">
          <div class="kpi">
            <div class="kpi-label">Today&rsquo;s Revenue</div>
            <div class="kpi-val">${fmtBig$(D.today_revenue)}</div>
            <div class="kpi-sub">${D.today_deals} deal${D.today_deals!==1?'s':''} today</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">MTD Revenue</div>
            <div class="kpi-val">${fmtBig$(D.total_revenue)}</div>
            <div class="kpi-sub">${daysLeft} days left</div>
          </div>
          ${(D.today_closers && D.today_closers.length) ? `
          <div class="kpi-closers">
            <div class="kpi-label">Today&rsquo;s Closers</div>
            <div class="closers-grid">
              ${D.today_closers.map(c => `
                <div class="closer-name">${c.name}${c.deals > 1 ? ' <span class="closer-count">x '+c.deals+'</span>' : ''}</div>
                <div class="closer-val">$${c.total.toLocaleString('en-US',{maximumFractionDigits:0})}</div>
              `).join('')}
            </div>
          </div>` : ''}
        </div>
      </div>`;

    // ── QUOTA STRIP
    const quotaStrip = `
      <div class="quota-strip fade d1">
        <span class="qs-label">Team Quota</span>
        <div class="qs-track"><div class="qs-fill" style="width:${qPct}%"></div></div>
        <span class="qs-pct">${D.pct_team_quota}%</span>
        <span class="qs-detail">${fmtBig$(D.total_revenue)} / ${fmtBig$(D.team_quota)}</span>
      </div>`;

    // ── BOARD 1: Revenue Closed
    const revSorted = [...reps].sort((a,b) => b.revenue - a.revenue);
    const b1Rows = revSorted.map((r,i) => {
      let qH;
      if (!r.quota) {
        if (r.deals > 0) {
          qH = `<div class="q-cell"><div class="q-bar"><div class="q-bar-fill bg-green" style="width:100%"></div></div><span class="pv t-green">N/A</span></div>`;
        } else if (r.is_manager) {
          qH = `<span class="pv" style="color:var(--text-faint)">N/A</span>`;
        } else {
          qH = `<span class="pv" style="color:var(--amber)">● Ramping</span>`;
        }
      } else {
        const [bg,tc] = qCol(r.pct_to_quota);
        const bw = Math.min(r.pct_to_quota, 100);
        qH = `<div class="q-cell"><div class="q-bar"><div class="q-bar-fill ${bg}" style="width:${bw}%"></div></div><span class="pv ${tc}">${r.pct_to_quota}%</span></div>`;
      }
      const badge = (r.quota && r.pct_to_quota >= 100) ? '<span class="goal-badge">At Goal</span>' : '';
      return `<tr>
        <td><span class="${rkC(i)}">${i+1}</span>${repLabel(r)}${badge}</td>
        <td>${fmt$(r.revenue)}</td>
        <td>${qH}</td>
      </tr>`;
    }).join('');
    const [,tqTc] = qCol(D.pct_team_quota);
    const board1 = `
      <div class="board fade d2">
        <div class="board-head"><div class="board-title">Revenue Closed</div><div class="board-sub">Per rep &middot; % to quota</div></div>
        <table>
          <thead><tr><th>Rep</th><th>Revenue</th><th>% Quota</th></tr></thead>
          <tbody>${b1Rows}</tbody>
          <tfoot><tr><td>Team Total</td><td>${fmt$(D.total_revenue)}</td><td><span class="pv ${tqTc}">${D.pct_team_quota}%</span></td></tr></tfoot>
        </table>
      </div>`;

    // ── BOARD 2: Opps Closed
    const dealSorted = [...reps].sort((a,b) => b.deals - a.deals);
    const b2Rows = dealSorted.map((r,i) => `<tr>
      <td><span class="${rkC(i)}">${i+1}</span>${repLabel(r)}</td>
      <td>${r.deals}</td>
      <td>${r.exclude_meetings ? '<span style="color:var(--text-faint)">N/A</span>' : `<span class="${rc(r.close_rate,20,10)}">${r.close_rate}%</span>`}</td>
    </tr>`).join('');
    const board2 = `
      <div class="board fade d2">
        <div class="board-head"><div class="board-title">Opps Closed</div><div class="board-sub">Deals closed &middot; close rate</div></div>
        <table>
          <thead><tr><th>Rep</th><th>Deals</th><th>Close %</th></tr></thead>
          <tbody>${b2Rows}</tbody>
          <tfoot><tr><td>Team Total</td><td>${D.total_deals}</td><td><span class="${rc(D.team_close_rate||0,20,10)}">${D.team_close_rate||0}%</span></td></tr></tfoot>
        </table>
      </div>`;

    // ── BOARD 3: Meetings Booked / Shown
    const mtgSorted = [...reps].sort((a,b) => b.booked - a.booked);
    const na = '<span style="color:var(--text-faint)">N/A</span>';
    const b3Rows = mtgSorted.map((r,i) => `<tr>
      <td><span class="${rkC(i)}">${i+1}</span>${repLabel(r)}</td>
      <td>${r.exclude_meetings ? na : r.booked}</td>
      <td>${r.exclude_meetings ? na : r.shown}</td>
      <td>${r.exclude_meetings ? na : `<span class="${rc(r.show_rate,65,45)}">${r.show_rate}%</span>`}</td>
    </tr>`).join('');
    const board3 = `
      <div class="board fade d2">
        <div class="board-head"><div class="board-title">Meetings Booked / Shown</div><div class="board-sub">New meetings &middot; show rate</div></div>
        <table>
          <thead><tr><th>Rep</th><th>Booked</th><th>Shown</th><th>Show %</th></tr></thead>
          <tbody>${b3Rows}</tbody>
          <tfoot><tr><td>Team Total</td><td>${D.total_booked}</td><td>${D.total_shown}</td><td><span class="${rc(D.team_show_rate||0,65,45)}">${D.team_show_rate||0}%</span></td></tr></tfoot>
        </table>
      </div>`;

    // ── BOARD 4: Process Adherence (shown when aggregate adherence is present)
    let adherenceBoard = '';
    if (D.adherence_meta && reps.some(r => r.adherence)) {
      const adherenceSorted = reps
        .filter(r => !r.exclude_meetings && r.adherence)
        .sort((a,b) => b.revenue - a.revenue);
      const adherenceRows = adherenceSorted.map((r,i) => {
        const sourceIndex = reps.indexOf(r);
        return `<tr>
          <td>${repLabel(r)}</td>
          <td class="adherence-average-cell">${adherenceButton(r, 'pre_call', sourceIndex)}</td>
          <td>${adherenceStepValue(r, 'loom_usage')}</td>
          <td>${adherenceStepValue(r, 'precall_text')}</td>
          <td class="adherence-average-cell adherence-post-start">${adherenceButton(r, 'post_call', sourceIndex)}</td>
          <td>${adherenceStepValue(r, 'followup_task')}</td>
          <td>${adherenceStepValue(r, 'followup_completed')}</td>
          <td>${adherenceStepValue(r, 'recap_email')}</td>
        </tr>`;
      }).join('');
      const cohort = D.adherence_meta.cohort || {};
      adherenceBoard = `
        <div class="board adherence-board fade d2">
          <div class="board-head">
            <div><div class="board-title">Process Adherence</div><div class="board-sub">Equal-weight step averages &middot; click a percentage for the breakdown</div></div>
          </div>
          <div class="adherence-table-wrap">
            <table>
              <colgroup>
                <col style="width:18%"><col style="width:9%"><col style="width:13%"><col style="width:13%">
                <col style="width:9%"><col style="width:12.67%"><col style="width:12.66%"><col style="width:12.67%">
              </colgroup>
              <thead>
                <tr class="adherence-group-row">
                  <th class="adherence-rep-head" scope="col" rowspan="2">Rep</th>
                  <th scope="colgroup" colspan="3">Pre-call</th>
                  <th class="adherence-post-group" scope="colgroup" colspan="4">Post-call</th>
                </tr>
                <tr class="adherence-column-row">
                  <th scope="col">Average</th>
                  <th scope="col">Pre-Call Loom</th>
                  <th scope="col">Pre-call text</th>
                  <th class="adherence-post-start" scope="col">Average</th>
                  <th scope="col">Next steps set</th>
                  <th scope="col">Next steps completed</th>
                  <th scope="col">Post-call follow-up</th>
                </tr>
              </thead>
              <tbody>${adherenceRows}</tbody>
              <tfoot><tr><td>Scored cohort</td><td colspan="7">${cohort.included || 0} first calls &middot; ${D.adherence_meta.period.month}</td></tr></tfoot>
            </table>
          </div>
        </div>`;
    }

    const footerSource = D.adherence_meta && D.adherence_meta.preview_only
      ? 'Local preview from Close CRM'
      : 'Data from Close CRM';
    const footer = `<div class="footer fade d2">${footerSource} &middot; Auto-updates every 15 minutes Mon&ndash;Fri 7 AM &ndash; 5 PM PST &middot; <a href="archive.html" style="color:var(--text-muted);text-decoration:underline">Monthly Archives</a> &middot; <a class="dl-btn" onclick="downloadCSV()">⬇ Download CSV</a></div>`;
    app.innerHTML = topBar + quotaStrip + `<div class="boards">${board1}${board2}${board3}${adherenceBoard}</div>` + footer;
    wireAdherenceButtons(D);
  }

  const drawer = document.getElementById('adherenceDrawer');
  const drawerClose = document.getElementById('drawerClose');
  const drawerContent = document.getElementById('drawerContent');
  const drawerTitle = document.getElementById('drawerTitle');
  const drawerEyebrow = document.getElementById('drawerEyebrow');
  let drawerTrigger = null;
  let closeTimer = null;
  const stepHelp = {
    loom_usage: 'Loom link recorded at or before the first-call deadline.',
    precall_text: 'Non-empty outbound SMS recorded at or before the first-call deadline.',
    followup_task: 'A dated task or a later non-canceled meeting is set.',
    followup_completed: 'A qualifying task is completed or a later meeting is marked completed.',
    recap_email: 'Outbound email or SMS is sent within 24 hours of the held first call.'
  };

  function wireAdherenceButtons(D) {
    document.querySelectorAll('[data-adherence-rep]').forEach(button => {
      button.addEventListener('click', () => {
        const rep = (D.reps || [])[Number(button.dataset.adherenceRep)];
        openAdherenceDrawer(rep, button.dataset.adherencePhase, button);
      });
    });
  }

  function openAdherenceDrawer(rep, phase, trigger) {
    if (!rep || !rep.adherence) return;
    if (closeTimer) clearTimeout(closeTimer);
    drawerTrigger = trigger;
    const isPre = phase === 'pre_call';
    const phaseLabel = isPre ? 'Pre-call adherence' : 'Post-call adherence';
    const phaseValue = rep.adherence[isPre ? 'pre_call_pct' : 'post_call_pct'];
    const keys = isPre
      ? ['loom_usage', 'precall_text']
      : ['followup_task', 'followup_completed', 'recap_email'];
    const cards = keys.map(key => {
      const cell = rep.adherence.steps[key];
      const pct = cell.pct;
      return `<article class="step-card">
        <div class="step-top"><div class="step-name">${cell.label}</div><div class="step-pct ${scoreTone(pct)}">${pctText(pct)}</div></div>
        <div class="step-track" aria-hidden="true"><div class="step-fill ${scoreTone(pct)}" style="width:${pct == null ? 0 : pct}%"></div></div>
        <div class="step-meta"><span>${stepHelp[key]}</span><span class="step-count">${cell.done} / ${cell.eligible}</span></div>
      </article>`;
    }).join('');
    drawerEyebrow.textContent = phaseLabel;
    drawerTitle.textContent = rep.name;
    drawerContent.innerHTML = `
      <div class="drawer-score">
        <div class="drawer-score-value ${scoreTone(phaseValue)}">${pctText(phaseValue)}</div>
        <div><div class="drawer-score-label">${phaseLabel}</div><p class="drawer-score-note" id="drawerDescription">Equal average of the available step percentages below. Neutral steps are excluded.</p></div>
      </div>
      <div class="step-list">${cards}</div>
      <p class="drawer-rule-note">This calculation uses first calls scheduled in the dashboard month. A no-show requires only Next steps set; the other post-call steps remain neutral.</p>`;
    drawer.hidden = false;
    document.body.classList.add('drawer-open');
    app.inert = true;
    requestAnimationFrame(() => {
      drawer.classList.add('is-open');
      drawerClose.focus();
    });
  }

  function closeAdherenceDrawer() {
    if (drawer.hidden) return;
    drawer.classList.remove('is-open');
    document.body.classList.remove('drawer-open');
    app.inert = false;
    closeTimer = setTimeout(() => { drawer.hidden = true; }, 240);
    if (drawerTrigger) drawerTrigger.focus();
  }

  drawerClose.addEventListener('click', closeAdherenceDrawer);
  drawer.addEventListener('click', event => {
    if (event.target === drawer) closeAdherenceDrawer();
  });
  document.addEventListener('keydown', event => {
    if (drawer.hidden) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      closeAdherenceDrawer();
      return;
    }
    if (event.key !== 'Tab') return;
    const focusable = [...drawer.querySelectorAll('button:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')];
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault(); last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault(); first.focus();
    }
  });

  window.downloadCSV = function() {
    if (!window._dashData) return;
    const D = window._dashData;
    const rows = [['Rep','Revenue','Deals','Quota','% to Quota','Booked','Shown','Close Rate','Show Rate','Pre-call Adherence','Post-call Adherence']];
    const reps = (D.reps || []).slice().sort((a,b) => b.revenue - a.revenue);
    for (const r of reps) {
      rows.push([
        r.name + (r.is_manager ? ' (mgr)' : ''),
        r.revenue.toFixed(2),
        r.deals,
        r.quota || '',
        r.quota ? r.pct_to_quota + '%' : 'N/A',
        r.exclude_meetings ? 'N/A' : r.booked,
        r.exclude_meetings ? 'N/A' : r.shown,
        r.exclude_meetings ? 'N/A' : r.close_rate + '%',
        r.exclude_meetings ? 'N/A' : r.show_rate + '%',
        r.adherence ? pctText(r.adherence.pre_call_pct) : 'N/A',
        r.adherence ? pctText(r.adherence.post_call_pct) : 'N/A',
      ]);
    }
    rows.push([
      'TEAM TOTAL',
      D.total_revenue.toFixed(2),
      D.total_deals,
      D.team_quota || '',
      D.pct_team_quota + '%',
      D.total_booked,
      D.total_shown,
      D.team_close_rate + '%',
      D.team_show_rate + '%',
      '',
      '',
    ]);
    const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type: 'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const month = (D.month_label || 'data').toLowerCase().replace(/\s+/g, '-');
    a.href = url;
    a.download = `rep-dashboard-${month}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  setInterval(() => location.reload(), 5 * 60 * 1000);
})();
</script>
</body>
</html>
